name: Costa&Costa CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Build e testes de regressao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check and build
        run: npm run build
      - name: Validate recipe ingredient parsing
        run: npm run test:ingredients
      - name: Validate measure draft batches
        run: npm run test:measure-batch
      - name: Validate editorial review batches
        run: npm run test:editorial-batch
      - name: Validate full-inventory dry-run auditor
        run: node scripts/test-measure-inventory-audit.mjs
      - name: Validate private beta catalog access guards
        run: node scripts/test-beta-private-access.mjs
      - name: Validate planner, shopping and allergy guards
        run: npm run test:pilot-flow
