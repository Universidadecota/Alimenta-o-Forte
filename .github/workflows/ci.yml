name: Costa&Costa CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
                - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check and build
        run: npm run build
